<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOURAV CHOUDHARY</title>
<meta name="description" content="GOURAV CHOUDHARY - website designer and developer. See my projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1014;--card:#171922;--line:#262a37;--text:#ECEDF2;--muted:#9AA0B4;--accent:#8B7CFF}
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth;color-scheme:dark}
  body{background:var(--bg);color:var(--text);font:400 1.05rem/1.6 "DM Sans",system-ui,-apple-system,sans-serif}
  h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.05}
  a{color:inherit}
  a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 1.25rem}

  /* Navbar */
  nav{position:sticky;top:0;z-index:10;background:rgba(15,16,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
  .logo{font:800 1.1rem "Bricolage Grotesque",sans-serif;text-decoration:none}
  .links{display:flex;gap:1.5rem}
  .links a{text-decoration:none;color:var(--muted);font-weight:500}
  .links a:hover{color:var(--text)}

  /* Hero */
  .hero{padding:5rem 0 3rem;background:radial-gradient(600px 300px at 15% 0,rgba(139,124,255,.18),transparent 70%)}
  .hero h1{font-weight:800;font-size:clamp(2.4rem,9vw,5.5rem);max-width:12ch}
  .hero p{margin-top:1rem;font-size:1.2rem;color:var(--muted);max-width:46ch}
  .btn{display:inline-block;margin-top:1.5rem;padding:.8rem 1.4rem;border-radius:999px;background:var(--accent);color:#0f1014;font-weight:500;text-decoration:none}
  .btn:hover{filter:brightness(1.1)}

  h2{font-size:clamp(1.7rem,5vw,2.4rem);margin:3rem 0 1.25rem}

  /* Project cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none}
  .thumb{aspect-ratio:3/2;display:grid;place-items:center;background:linear-gradient(135deg,#2a2650,#14152a);
    font:800 2.2rem "Bricolage Grotesque",sans-serif;color:var(--accent)}
  .info{padding:1rem 1.1rem 1.2rem}
  .info h3{font-weight:500;font-size:1.3rem}
  .info p{color:var(--muted);font-size:.95rem;margin-top:.25rem}
  .info span{display:inline-block;margin-top:.8rem;font-weight:500;color:var(--accent)}
  @media (hover:hover) and (prefers-reduced-motion:no-preference){
    .card{transition:transform .2s,border-color .2s}
    .card:hover{transform:translateY(-4px);border-color:var(--accent)}
  }

  .contact{margin-top:3.5rem;padding:2.5rem 0 3rem;border-top:1px solid var(--line)}
  .contact a{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1.2rem,5vw,2.1rem);color:var(--accent);word-break:break-all}
  footer{padding-bottom:2rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="#top">GOURAV CHOUDHARY</a>
    <div class="links"><a href="#projects">Projects</a><a href="#contact">Contact</a></div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <h1>GOURAV CHOUDHARY</h1>
    <p>I design and build websites. Here is what I have made.</p>
    <a class="btn" href="#projects">See my projects</a>
  </div>
</header>

<main class="wrap">
  <h2 id="projects">My projects</h2>
  <div class="grid">
    <!-- Movies project: clicking opens the link below -->
    <a class="card" href="https://bingr.one/home" target="_blank" rel="noopener">
      <div class="thumb" aria-hidden="true">Movies</div>
      <div class="info"><h3>Movies</h3><p>Movies</p></div>
    </a>
  </div>

  <section class="contact" id="contact">
    <h2 style="margin-top:0">Want a website?</h2>
    <p style="margin-bottom:.75rem;color:var(--muted)">Send me a message and tell me what you need.</p>
    <a href="mailto:jatx5351@gmail.com">jatx5351@gmail.com</a>
  </section>
</main>

<footer class="wrap">&copy; 2026 GOURAV CHOUDHARY</footer>

</body>
</html>
